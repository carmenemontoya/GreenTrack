<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTrack Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

<div class="login-container">
    <div class="login-branding">
        <div>
            <h1>GreenTrack</h1>
            <p class="brand-subtitle">Campus Sustainability Dashboard</p>
        </div>
    </div>

    <div class="login-grid">
        <section class="login-card">
            <h2>Welcome Back</h2>
            <p class="login-subtitle">Sign in to access your sustainability dashboard.</p>

            <form class="login-form" action="#" onsubmit="return false;">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <span class="material-symbols-outlined">mail</span>
                        <input id="email" type="email" placeholder="Enter your email" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <span class="material-symbols-outlined">lock</span>
                        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="icon-button" id="togglePassword" aria-label="Show password">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="form-meta">
                    <label class="checkbox-label"><input type="checkbox" id="rememberMe"> Remember me</label>
                    <a href="#" class="text-link">Forgot Password?</a>
                </div>

                <button class="primary-button" id="loginButton" type="button">
                    <span class="material-symbols-outlined">login</span>
                    Sign In
                </button>
                <p class="login-message" id="loginMessage"></p>
            </form>
        </section>
    </div>
</div>

<footer class="login-footer">
    <p>GreenTrack © 2026</p>
    <p>Campus Sustainability Management System</p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
<script src="{{ url_for('static', filename='js/crud.js') }}"></script>
</body>
</html>
